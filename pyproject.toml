[project]
name = "wathiqa"
version = "0.1.0"
description = "Bilingual (Arabic/French) business-document intelligence - reference core"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "rapidfuzz>=3.6",
  "scipy>=1.11",
  "numpy>=1.26",
  "sqlglot>=25",
]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
synth = ["jinja2>=3.1", "playwright>=1.45", "opencv-python-headless>=4.9", "numpy>=1.26"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11", "pixeltable-pgserver", "jinja2>=3.1", "playwright>=1.45", "opencv-python-headless>=4.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wathiqa"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# Arabic and typographic characters are the point of these files.
"src/wathiqa/domain/normalize.py" = ["RUF001", "RUF003"]
"tests/*" = ["E501", "RUF001"]
"src/wathiqa/synth/*.py" = ["RUF001", "RUF003"]
